# ==========================================
# CONFIGURACION GENERAL
# ==========================================
spring.application.name=essalud-api
server.port=8080


# ==========================================
# CONEXION A SQL SERVER
# ==========================================
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=EsSaludDisponibilidadDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=essalud_app
spring.datasource.password=${ESSALUD_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ==========================================
# CONFIGURACION JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# RESPETAR LOS NOMBRES REALES DE SQL SERVER
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# ==========================================
# CONFIGURACION JWT
# ==========================================
app.jwt.secret=${ESSALUD_JWT_SECRET}
app.jwt.expiration-ms=86400000